name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Package
        run: mvn -q -DskipTests package

      - name: Run manual verification suite
        run: mvn -q exec:java -Dexec.mainClass=com.airtribe.meditrack.test.TestRunner

      - name: Generate JavaDocs
        run: mvn -q javadoc:javadoc
